name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install worthwatch and the test tools
        run: python -m pip install -e ".[dev]"
      # The tests refuse every network connection and need no GPU: YouTube and every model
      # are stubbed, and the audio path's transcriber is faked.
      - name: Tests
        run: python tests/run_all.py
      # The same tests with Python's clock a year and five years ahead, so a test whose fixture
      # date will run out fails now, not on the day it runs out (tests/clock/sitecustomize.py).
      - name: Tests, clock a year ahead
        run: python tests/run_all.py --clock +365
      - name: Tests, clock five years ahead
        run: python tests/run_all.py --clock +1826
      - name: Lint
        run: python -m pyflakes src scripts tests
      - name: No em-dashes
        run: python scripts/check_emdash.py --tree
